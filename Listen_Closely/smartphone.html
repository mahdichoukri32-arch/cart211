  <body>
    <a href="delivery.html" class="pixel-button" id="continue-button"
      >CLICK TO CONTINUE</a
    >
    <div class="dialogue">
      <p id="dialogue-text">
        It's 11 a.m. I've been working for six hours now. Damn, I'm so hungry.
      </p>

      <button id="next-button">NEXT</button>
    </div>
    <script>
      let dialogues = [
        "It's 11 a.m. I've been working for six hours now. Damn, I'm so hungry.",
        "Let me check the fridge... It's empty, as always! Ugh...",
        "I should've gone grocery shopping. Well, let me check the delivery app.",
      ];

      let dialogueIndex = 0;

      let dialogueText = document.getElementById("dialogue-text");
      let nextButton = document.getElementById("next-button");
      let continueButton = document.getElementById("continue-button");

      nextButton.addEventListener("click", function () {
        if (dialogueIndex < dialogues.length - 1) {
          dialogueIndex++;
          dialogueText.textContent = dialogues[dialogueIndex];
        }
        if (dialogueIndex === dialogues.length - 1) {
          nextButton.style.display = "none";
          continueButton.style.display = "block";
        }
      });
    </script>
  </body>
