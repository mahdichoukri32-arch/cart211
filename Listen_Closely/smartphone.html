<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>

    <!--Meta Description for my website-->
    <meta
      name="Description"
      content="Explore the visual game, Listen closely"
    />

    <!--Open Graph for Social Sharing-->
    <meta property="og:title" content="Home Page" />
    <meta
      property="og:Description"
      content="Explore the visual game, Listen closely"
    />

    <!--Author and Copyright-->
    <meta name="author" content="Mariam-Choukri Mahdi" />
    <meta
      name="copyrith"
      content="Mariam-Choukri Mahdi, student project, 2026"
    />

    <!--External Stylesheet-->
    <link rel="Stylesheet" href="style(1).css" />

    <!--The new Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tiny5:ital,wght@0,100..900;1,100..900&display=swap"
      rel="Stylesheet"
    />
  </head>
  <body>
    <div class="dialogue">
      <p id="dialogue-text">
        It's 11 a.m. I've been working for six hours now. Damn, I'm so hungry.
      </p>

      <button id="next-button">NEXT</button>
    </div>

    <!-- Go to delivery App -->
    <div id="delivery-app">
      <button id="pixel-button">OPEN APP</button>
    </div>

    <!--Image widget for the home page-->
    <img
      id="photo-widget"
      src="image/Party.png"
      alt="my friends are celebrating my birthday"
    />
    <script>
      let dialogues = [
        "It's 11 a.m. I've been working for six hours now. Damn, I'm so hungry.",
        "Let me check the fridge... It's empty, as always! Ugh...",
        "I should've gone grocery shopping. Well, let me check the delivery app.",
      ];

      let dialogueIndex = 0;

      let dialogueText = document.getElementById("dialogue-text");
      let nextButton = document.getElementById("next-button");
      let photoWidget = document.getElementById("photo-widget");
      let deliveryApp = document.getElementById("delivery-app");
      let OpenAppButton = document.getElementById("pixel-button");

      nextButton.addEventListener("click", function () {
        if (dialogueIndex < dialogues.length - 1) {
          dialogueIndex++;
          dialogueText.textContent = dialogues[dialogueIndex];
          // Show the smartphone home page
          if (dialogueIndex === 1) {
            document.body.style.backgroundImage =
              'url("image/Smartphone_Home_Page.png")';
            photoWidget.style.display = "block";
          }
          // Show the delivery app icon
          if (dialogueIndex === 2) {
            document.body.style.backgroundImage =
              'url("image/Smartphone_Home_Page_Delivery App.png")';

            photoWidget.style.display = "none";

            deliveryApp.style.display = "block";
          }
        }
        if (dialogueIndex === dialogues.length - 1) {
          nextButton.style.display = "none";
        }
      });
      OpenAppButton.addEventListener("click", function () {
        window.location.href = "delivery.html";
      });
    </script>
  </body>
</html>
